name: gasosa_app
description: "App para registrar e acompanhar abastecimentos de veículos."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

# ------------------------
# DEPENDÊNCIAS DE PRODUÇÃO
# ------------------------
dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^15.1.0
  image_picker: ^1.1.2
  super_banners: ^0.0.1
  validatorless: ^1.2.4
  intl: ^0.20.2

  # State Management
  flutter_bloc: ^9.1.0

  # Injeção de Dependência
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Functional Programming
  dartz: ^0.10.1
  uuid: ^4.5.1

  # Persistência de Dados
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.32
  sqlite3: ^2.7.5
  path: ^1.9.1
  path_provider: ^2.1.5

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2

  # Freezed (para modelos imutáveis e estados)
  freezed_annotation: ^2.4.4
  # freezed_annotation: ^3.0.0
  freezed: ^2.5.2
  top_snackbar_flutter: ^3.2.0
  shared_preferences: ^2.5.3
  dropdown_button2: ^2.3.9
  flutter_slidable: ^4.0.0
  flutter_multi_formatter: ^2.13.7
  collection: ^1.19.1
  # freezed: ^3.0.6

# ------------------------
# DEPENDÊNCIAS DE DESENVOLVIMENTO
# ------------------------
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lint
  flutter_lints: ^5.0.0

  # Geradores de Código
  build_runner: ^2.4.15
  injectable_generator: ^2.7.0
  drift_dev: ^2.26.0

  # Testes
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

  # Ícones de Launcher
  flutter_launcher_icons: ^0.14.3

  # Flavor Management
  flutter_flavorizr: ^2.4.0

# ------------------------
# CONFIGURAÇÕES DO FLUTTER
# ------------------------
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

# ------------------------------
# CONFIGURAÇÕES DO FLUTTER ICONS 
# ------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon_prod.png"
  flavors:
    dev:
      image_path: "assets/icons/icon_dev.png"
    prod:
      image_path: "assets/icons/icon_prod.png"
